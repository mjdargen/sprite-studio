<!doctype html>
<!--
  Tests for Sprite Studio's core logic. Open this page through a local web
  server (see MAINTAINING.md) and it runs every test in tests.js and lists the
  results. Run it after changing anything in js/core or js/formats.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Studio Tests</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { margin: 0 auto; padding: 16px; max-width: 900px; background: Canvas; color: CanvasText; }
  h1 { font-size: 1.4rem; }
  #summary { font-weight: 700; }
  .pass { color: #2e7d32; }
  .fail { color: #c62828; }
  li { margin: 2px 0; }
  pre { white-space: pre-wrap; margin: 2px 0 6px 18px; font-size: 0.85rem; }
</style>
<script type="module" src="tests.js"></script>
</head>
<body>
  <h1>Sprite Studio tests</h1>
  <p id="summary">Running…</p>
  <ul id="results"></ul>
</body>
</html>
